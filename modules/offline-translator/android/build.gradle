plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.offlinetranslator'
version = '1.0.0'

android {
  namespace 'expo.modules.offlinetranslator'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.google.mlkit:translate:17.0.3'
}
